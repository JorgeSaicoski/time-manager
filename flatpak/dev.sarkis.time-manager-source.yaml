# Flatpak Manifest for Building from Source
# 
# This is an improved manifest that builds the Time Manager application
# from source instead of using a pre-built binary.
# This manifest is required for Flathub submission.
#
# NOTE: This requires testing and may need adjustments based on
# the actual build process and dependencies.

id: dev.sarkis.time-manager
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
  - org.freedesktop.Sdk.Extension.node18

command: time-manager

finish-args:
  # Network access for potential future features
  - --share=network
  # Display server access
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  # GPU acceleration
  - --device=dri
  # File system access for data storage
  - --persist=.local/share/time-manager
  - --filesystem=xdg-download
  # DBus access
  - --socket=session-bus

build-options:
  append-path: /usr/lib/sdk/golang/bin:/usr/lib/sdk/node18/bin
  env:
    GOROOT: /usr/lib/sdk/golang
    GOPATH: /run/build/time-manager/go
    GO111MODULE: 'on'
    CGO_ENABLED: '1'

modules:
  # Build the application from source
  - name: time-manager
    buildsystem: simple
    build-commands:
      # Install Node.js dependencies and build frontend
      - cd frontend && npm install --offline
      - cd frontend && npm run build
      
      # Get Go dependencies
      - go mod download
      
      # Build the Wails application
      # Note: This is a simplified version. The actual Wails build process
      # may require additional steps or the wails CLI tool
      - go build -o time-manager -ldflags="-w -s" -tags desktop,production
      
      # Install the application
      - install -Dm755 time-manager /app/bin/time-manager
      - install -Dm644 flatpak/files/dev.sarkis.time-manager.desktop /app/share/applications/dev.sarkis.time-manager.desktop
      - install -Dm644 flatpak/files/dev.sarkis.time-manager.metainfo.xml /app/share/metainfo/dev.sarkis.time-manager.metainfo.xml
      - install -Dm644 flatpak/files/dev.sarkis.time-manager.png /app/share/icons/hicolor/128x128/apps/dev.sarkis.time-manager.png
      
    sources:
      # Main source code
      - type: git
        url: https://github.com/JorgeSaicoski/time-manager.git
        # TODO: Update this to use an actual release tag when available
        # For testing, use a specific commit instead:
        # commit: <commit-hash>
        # For production Flathub submission, use a release tag:
        # tag: v1.0.0
        branch: main
      
      # Node.js dependencies (generated with flatpak-node-generator)
      # TODO: Generate this file using:
      # flatpak-node-generator npm frontend/package-lock.json -o flatpak-node-sources.json
      # Then uncomment:
      # - flatpak-node-sources.json
      
      # Go dependencies (generated with flatpak-go-generator)
      # TODO: Generate this file using:
      # flatpak-go-generator go.mod -o flatpak-go-sources.json
      # Then uncomment:
      # - flatpak-go-sources.json

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'
